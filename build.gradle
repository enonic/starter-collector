plugins {
	id 'java' // Needed for assemble and build
	//id 'maven' // When is this needed?
	id 'maven-publish' // Provides publishing and publishToMavenLocal
	id 'com.enonic.xp.app'
	//id 'com.moowork.node' version '1.3.1'
	id 'com.github.node-gradle.node' version '7.1.0'
}


repositories {
	mavenLocal()
	xp.enonicRepo()
	mavenCentral()
}


dependencies {
	implementation xplibs.api.core
	implementation xplibs.api.portal

	//──────────────────────────────────────────────────────────────────────────
	// Core libs (com.enonic.xp)
	//──────────────────────────────────────────────────────────────────────────

	include xplibs.admin
	include xplibs.auth
	//include xplibs.cluster
	//include xplibs.common
	//include xplibs.content
	include xplibs.context
	include xplibs.event // Needed by lib-explorer
	//include xplibs.i18n
	//include xplibs.io
	//include xplibs.mail
	//include xplibs.mustache
	include xplibs.node
	//include xplibs.portal
	include xplibs.repo
	include xplibs.task
	//include xplibs.thymeleaf
	//include xplibs.websocket
	//include xplibs.xslt

	//──────────────────────────────────────────────────────────────────────────
	// Other enonic libs (com.enonic.lib)
	//──────────────────────────────────────────────────────────────────────────

	//include 'com.enonic.lib:lib-cache:1.1.0'
	//include 'com.enonic.lib:lib-guillotine:1.0.1'
	include 'com.enonic.lib:lib-http-client:4.0.1'
	//include 'com.enonic.lib:menu:1.3.3'
	//include 'com.enonic.lib:text-encoding:1.2.0'

	include 'com.enonic.lib:lib-explorer:5.0.0' // version number must be here or dependabot will not upgrade it

	// WARNING: Do NOT use include files, jar file will be missing dependencies!
}


tasks.withType(Copy) {
  includeEmptyDirs = false
}


//──────────────────────────────────────────────────────────────────────────────
// Gradle wrapper
//──────────────────────────────────────────────────────────────────────────────
wrapper {
	distributionUrl = "${gradleDistributionUrl}"
}


//──────────────────────────────────────────────────────────────────────────────
// Gradle node plugin
//──────────────────────────────────────────────────────────────────────────────
node {
	download = true
	version = "${nodeVersion}"
}


//──────────────────────────────────────────────────────────────────────────────
// Webpack
//──────────────────────────────────────────────────────────────────────────────
sourceSets {
	main {
		java {
			srcDir 'src/main/java'
		}
		resources { // Paths relative to src/main/resources
			exclude 'assets/**/*.svg'
		}
	}
}


task webpack(type:NodeTask) {
	args = [
		'--color'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
		'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
		'NODE_ENV': project.hasProperty('dev') || project.hasProperty('development') ? 'development' : 'production'
	]
	mustRunAfter npmInstall
	outputs.dir './build/resources/main' // processResources will delete the directory if this is not present
	script = file('node_modules/webpack-cli/bin/cli.js')
}


task watch(type:NodeTask) {
	script = file('node_modules/webpack-cli/bin/cli.js')
	args = [
		'--color',
		'--watch'
	]
}


processResources {
	dependsOn webpack
	mustRunAfter webpack

	exclude '**/.gitkeep'

	// Let gradle copy these
	//include '**/*.mjs'
	//include '**/*.xml'

	// Let webpack handle these (rather than gradle)
	exclude '**/*.css'
	exclude '**/*.es'
	exclude '**/*.js'
	exclude '**/*.jsx'
	exclude '**/*.less'
	exclude '**/*.sass'
	exclude '**/*.scss'
	exclude '**/*.styl'
	exclude '**/*.ts'
}


publishing {
	publications {
		mavenJava( MavenPublication ) {
			from components.java
		}
	}
	/*repositories {
		maven {
			url 'http://repo.enonic.net/artifactory/public'
		}
	}*/
}
